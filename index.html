<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Dork Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg:#020617;
  --card:#0f172a;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#2563eb;
  --success:#16a34a;
  --border:#1f2937;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:Inter,system-ui,sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:var(--text);
}

.container{
  max-width:1100px;
  margin:auto;
  background:var(--card);
  padding:24px;
  border-radius:16px;
  border:1px solid var(--border);
}

header h1{margin:0}
.badge{
  margin-top:6px;
  display:inline-block;
  background:rgba(34,197,94,.15);
  color:#22c55e;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

.section{margin-top:26px}
.section h2{
  font-size:15px;
  color:#c7d2fe;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}

label{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
}

textarea{
  min-height:120px;
  font-family:ui-monospace,SFMono-Regular,monospace;
}

input:focus,textarea:focus{
  outline:none;
  border-color:var(--primary);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.generate{background:var(--primary);color:#fff}
.search{background:var(--success);color:#fff}
.reset{background:#1f2937;color:var(--muted)}
.copy{background:#334155;color:#fff}

footer{
  margin-top:30px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Advanced Google Dork Generator</h1>
  <span class="badge">OSINT & Research </span>
</header>

<div class="section">
<h2>Search Filters</h2>
<div class="grid">
  <div><label>Site</label><input id="site" placeholder="example.com"></div>
  <div><label>Filetype</label>
    <select id="filetype">
      <option value="">-- pilih --</option>
      <option>pdf</option><option>docx</option><option>xls</option>
      <option>txt</option><option>sql</option><option>env</option>
      <option>python</option><option>html</option><option>sh</option>
      <option>exe</option><option>yaml</option>
    </select>
  </div>
  <div><label>After Date</label><input type="date" id="after"></div>
  <div><label>Before Date</label><input type="date" id="before"></div>
  <div><label>In URL</label><input id="inurl" placeholder="login"></div>
  <div><label>In Title</label><input id="intitle" placeholder="admin panel"></div>
</div>
</div>

<div class="section">
<h2>Text Operators</h2>
<div class="grid">
  <div><label>In Text</label><input id="intext" placeholder="password token"></div>
  <div><label>All In Text</label><input id="allintext" placeholder="username password"></div>
  <div><label>Exact Text</label><input id="text" placeholder="confidential"></div>
  <div><label>Exclude Text</label><input id="extext" placeholder="sample"></div>
</div>
</div>

<div class="section">
<div class="actions">
  <button class="generate" onclick="generateDork()">Generate</button>
  <button class="copy" onclick="copyOutput()">Copy</button>
  <button class="search" onclick="searchGoogle()">Search</button>
  <button class="reset" onclick="resetForm()">Reset</button>
</div>
</div>

<div class="section">
<h2>Generated Dork</h2>
<textarea id="output" readonly></textarea>
</div>

<footer>
© 2025 jioah.github.io · Ethical OSINT Tool
</footer>

</div>

<script>
function val(id){return document.getElementById(id).value.trim()}

function generateDork(){
  let dork=[]

  if(val('site')) dork.push(`site:${val('site')}`)
  if(val('filetype')) dork.push(`filetype:${val('filetype')}`)
  if(val('after')) dork.push(`after:${val('after')}`)
  if(val('before')) dork.push(`before:${val('before')}`)
  if(val('inurl')) dork.push(`inurl:${val('inurl')}`)
  if(val('intitle')) dork.push(`intitle:${val('intitle')}`)

  if(val('intext')) dork.push(`intext:"${val('intext')}"`)
  if(val('allintext')) dork.push(`allintext:"${val('allintext')}"`)
  if(val('text')) dork.push(`"${val('text')}"`)
  if(val('extext')) dork.push(`-"${val('extext')}"`)

  document.getElementById('output').value=dork.join(' ')
}

function searchGoogle(){
  generateDork()
  const q=document.getElementById('output').value
  if(!q) return alert('Dork kosong')
  window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')
}

function resetForm(){
  document.querySelectorAll('input,select,textarea').forEach(e=>e.value='')
}

function copyOutput(){
  const text=document.getElementById('output').value
  if(!text) return alert('Output kosong')
  navigator.clipboard.writeText(text).then(()=>alert('Dork disalin'))
}
</script>

</body>
</html>
